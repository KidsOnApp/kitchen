name: nightly
# Every night: jazz concerts (concerts.json) and Unsplash background photos (photos.json)
on:
  push:
    paths: [".github/workflows/concerts.yml", "tools/**.py"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: concerts
        run: python tools/concerts.py
        continue-on-error: true
      - name: photos
        run: python tools/photos.py
        continue-on-error: true
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      - name: commit result
        run: |
          git config user.name "kitchen-bot"
          git config user.email "kitchen-bot@users.noreply.github.com"
          git add concerts.json tools/artists-cache.json tools/concerts-log.json
          [ -f photos.json ] && git add photos.json tools/photos-state.json
          git diff --cached --quiet || (git commit -m "Update concerts and photos [skip ci]" && git push)
